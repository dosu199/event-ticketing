# =============================================================
# booking-service configuration
# =============================================================

spring:
  application:
    name: booking-service
  data:
    redis:
      # Redis from infra/docker/docker-compose.yml. Holds live here.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8082

# Where to find event-service (seat lists, event status).
# Later: a service name (Docker/Kubernetes DNS) instead of localhost.
services:
  event-service:
    url: ${EVENT_SERVICE_URL:http://localhost:8081}

booking:
  hold:
    # How long seats stay reserved for a user before they're released automatically.
    ttl: PT10M
    # Maximum seats in one hold (protects against one user grabbing a whole venue).
    max-seats: 6

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
