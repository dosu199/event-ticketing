# =============================================================
# api-gateway configuration
# Single entry point for the frontend: routes /api/** to services
# and applies CORS.
# =============================================================

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # /api/events/**  -> event-service  /events/**   ("/api" stripped)
            - id: event-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/events,/api/events/**
              filters:
                - StripPrefix=1

            # /api/booking/** -> booking-service /**   ("/api/booking" stripped)
            #   /api/booking/events/1/availability -> /events/1/availability
            #   /api/booking/holds                 -> /holds
            - id: booking-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/booking/**
              filters:
                - StripPrefix=2

          # Only the React dev server may call the API from a browser.
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:5173
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                max-age: 3600

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
