# =============================================================
# api-gateway configuration
# Single entry point for the frontend: routes /api/** to services
# and applies CORS. See docs/phases for details.
# =============================================================

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # /api/events and /api/events/** -> event-service, "/api" stripped
            - id: event-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/events,/api/events/**
              filters:
                - StripPrefix=1

          # Only the React dev server may call the API from a browser.
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:5173
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                max-age: 3600

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # health, info, and gateway (lists the active routes)
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
