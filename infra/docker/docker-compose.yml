# =====================================================================
# LOCAL INFRASTRUCTURE (Phase 0)
# ---------------------------------------------------------------------
# Starts everything the services DEPEND ON. The Spring services themselves
# run from your IDE/terminal for now (`./mvnw spring-boot:run`); they get
# their own containers later.
#
# Usage (from the repo root; the Makefile wraps these):
#   docker compose -f infra/docker/docker-compose.yml --env-file .env up -d
#   docker compose -f infra/docker/docker-compose.yml ps
#   docker compose -f infra/docker/docker-compose.yml down
#
# Full explanation of every service below: docs/phases/phase-0.md
# =====================================================================

# Prefix for container, network and volume names (et-postgres, et_pgdata...).
name: et

services:

  # -------------------------------------------------------------------
  # PostgreSQL: the relational database for event/booking/payment/ticket.
  # One container, one database + user per service (ADR 0004).
  # -------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine            # alpine = smaller image
    container_name: et-postgres
    environment:
      # Superuser, used only by the init script and by you for admin work.
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      # Password given to every per-service user created by the init script.
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-secret}
    ports:
      - "5432:5432"                      # host:container
    volumes:
      # Named volume: data survives `docker compose down` (but not `down -v`).
      - pgdata:/var/lib/postgresql/data
      # Scripts in this folder run ONCE, when the data volume is first created.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready answers "accepting connections" once Postgres is usable.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------
  # Redis: in-memory key-value store.
  # Used for seat holds with TTL (booking-service) and rate limiting (gateway).
  # -------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: et-redis
    ports:
      - "6379:6379"
    # No persistence: holds are short-lived by design, so losing them on
    # restart is fine and keeps Redis fast and simple.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]   # replies PONG when ready
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------
  # Kafka: event log / message broker, single node in KRaft mode
  # (no ZooKeeper; ADR 0003).
  #
  # TWO listeners, because "where is Kafka?" depends on who is asking:
  #   EXTERNAL  localhost:9092  -> apps running on your machine (IDE, mvnw)
  #   INTERNAL  kafka:29092     -> apps running inside this Docker network
  # A client connects, then Kafka replies "talk to me at <advertised address>".
  # If that address isn't reachable from the client, it fails, which is the
  # #1 Kafka-in-Docker problem.
  # -------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.2
    container_name: et-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      # This single node is both broker (stores messages) and controller (metadata).
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Only one broker exists, so internal topics can't be replicated more than once.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Start consumer groups immediately instead of waiting 3s (faster local dev).
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by our services (Phase 4), not by typos.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Cap the JVM heap so Kafka doesn't eat the Codespace's RAM.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    # No volume on purpose: topics and messages are wiped when the container
    # is removed. Locally that's a feature: every `down` gives a clean slate.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # -------------------------------------------------------------------
  # Kafka UI: a web console to browse topics, messages and consumer groups.
  # Not needed by the app, but extremely useful for learning and debugging.
  # http://localhost:8090
  # -------------------------------------------------------------------
  kafka-ui:
    image: kafbat/kafka-ui:latest        # maintained fork of provectus/kafka-ui
    container_name: et-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # Runs inside Docker, so it uses the INTERNAL listener.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy       # wait until Kafka is actually ready

  # -------------------------------------------------------------------
  # Keycloak: identity provider (login, users, roles, JWT tokens).
  # Admin console: http://localhost:8180  (admin / admin by default)
  # The realm with our roles/users/clients is added in Phase 2.
  # -------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: et-keycloak
    # start-dev: HTTP allowed, caching off, embedded dev database.
    # Never use dev mode in production.
    command: ["start-dev", "--http-port=8080", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8180:8080"                      # 8080 on the host is reserved for our gateway
    volumes:
      # Keeps Keycloak's dev database (realms, users) across restarts.
      - keycloakdata:/opt/keycloak/data

  # -------------------------------------------------------------------
  # Mailpit: fake SMTP server. Apps "send" email to it, and nothing leaves
  # your machine. Read the emails in its web inbox: http://localhost:8025
  # -------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: et-mailpit
    ports:
      - "1025:1025"                      # SMTP (apps send here)
      - "8025:8025"                      # web UI (you read here)

# Named volumes managed by Docker. Listed with `docker volume ls`.
volumes:
  pgdata:
  keycloakdata:
